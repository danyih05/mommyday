<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>给妈咪的母亲节网页 💐</title>

  <!-- 字体 -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&display=swap" rel="stylesheet">

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
    }

    body{
      overflow-x:hidden;
      min-height:100vh;
      background:
        radial-gradient(circle at top, #ffd6e7 0%, #ffc2dc 35%, #ffb3d5 65%, #ff9cc8 100%);
      font-family: 'ZCOOL KuaiLe', cursive;
      position:relative;
      color:white;
    }

    /* 背景闪光 */
    body::before{
      content:"";
      position:fixed;
      inset:0;
      background:
      radial-gradient(circle, rgba(255,255,255,0.25) 2px, transparent 2px);
      background-size:40px 40px;
      animation:sparkle 8s linear infinite;
      pointer-events:none;
      z-index:0;
    }

    @keyframes sparkle{
      from{
        transform:translateY(0);
      }
      to{
        transform:translateY(-40px);
      }
    }

    .container{
      position:relative;
      z-index:2;
      min-height:100vh;
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      padding:30px 20px 120px;
      text-align:center;
    }

    .flower-top{
      font-size:55px;
      animation:floatFlower 3s ease-in-out infinite;
      margin-bottom:18px;
      filter:drop-shadow(0 0 10px rgba(255,255,255,.6));
    }

    @keyframes floatFlower{
      0%,100%{
        transform:translateY(0px) rotate(0deg);
      }
      50%{
        transform:translateY(-12px) rotate(8deg);
      }
    }

    h1{
      font-size:2.8rem;
      line-height:1.4;
      text-shadow:
      0 4px 15px rgba(255,255,255,.5),
      0 0 25px rgba(255,255,255,.3);
      animation:popIn 1.2s ease;
    }

    .highlight{
      color:#fff8b0;
      font-size:3.1rem;
      display:inline-block;
      animation:bounce 1.8s infinite;
    }

    @keyframes bounce{
      0%,100%{
        transform:translateY(0);
      }
      50%{
        transform:translateY(-10px);
      }
    }

    .message{
      margin-top:28px;
      font-size:1.35rem;
      line-height:2;
      max-width:700px;
      background:rgba(255,255,255,0.18);
      padding:28px;
      border-radius:28px;
      backdrop-filter:blur(10px);
      box-shadow:
      0 10px 30px rgba(255,255,255,.2),
      inset 0 0 12px rgba(255,255,255,.3);
      animation:fadeUp 1.5s ease;
    }

    @keyframes fadeUp{
      from{
        opacity:0;
        transform:translateY(40px);
      }
      to{
        opacity:1;
        transform:translateY(0);
      }
    }

    .love{
      margin-top:20px;
      font-size:2rem;
      animation:heartbeat 1.2s infinite;
    }

    @keyframes heartbeat{
      0%,100%{
        transform:scale(1);
      }
      25%{
        transform:scale(1.12);
      }
      50%{
        transform:scale(0.96);
      }
      75%{
        transform:scale(1.08);
      }
    }

    .btn-group{
      display:flex;
      flex-wrap:wrap;
      gap:16px;
      justify-content:center;
      margin-top:35px;
    }

    button{
      border:none;
      padding:16px 26px;
      border-radius:999px;
      font-size:1rem;
      font-family: inherit;
      cursor:pointer;
      transition:all .25s;
      background:white;
      color:#ff5d9e;
      box-shadow:0 8px 20px rgba(0,0,0,.15);
    }

    button:hover{
      transform:translateY(-5px) scale(1.05);
    }

    button:active{
      transform:scale(.95);
    }

    /* 飘落花瓣 */
    .petal{
      position:fixed;
      top:-10px;
      font-size:22px;
      pointer-events:none;
      animation:fall linear forwards;
      z-index:1;
    }

    @keyframes fall{
      to{
        transform:
          translateY(110vh)
          rotate(720deg);
        opacity:0;
      }
    }

    /* 点击爱心 */
    .heart{
      position:fixed;
      font-size:24px;
      pointer-events:none;
      animation:heartFly 1.5s forwards;
      z-index:999;
    }

    @keyframes heartFly{
      0%{
        transform:translate(-50%, -50%) scale(0.5);
        opacity:1;
      }
      100%{
        transform:translate(-50%, -180px) scale(1.8);
        opacity:0;
      }
    }

    /* 底部提示 */
    .tip{
      position:fixed;
      bottom:18px;
      left:50%;
      transform:translateX(-50%);
      background:rgba(255,255,255,0.2);
      padding:12px 20px;
      border-radius:999px;
      backdrop-filter:blur(8px);
      font-size:0.95rem;
      z-index:5;
      animation:tipGlow 2s infinite;
    }

    @keyframes tipGlow{
      0%,100%{
        box-shadow:0 0 10px rgba(255,255,255,.2);
      }
      50%{
        box-shadow:0 0 20px rgba(255,255,255,.6);
      }
    }

    /* 滑动时的背景动态 */
    .scroll-effect{
      position:fixed;
      inset:0;
      background:linear-gradient(
      120deg,
      rgba(255,255,255,0.08),
      transparent,
      rgba(255,255,255,0.08));
      mix-blend-mode:screen;
      pointer-events:none;
      z-index:0;
      transform:translateY(0);
      transition:transform .2s;
    }

    /* 手机优化 */
    @media (max-width:768px){

      h1{
        font-size:2.1rem;
      }

      .highlight{
        font-size:2.5rem;
      }

      .message{
        font-size:1.1rem;
        padding:22px;
      }

      .flower-top{
        font-size:45px;
      }

      button{
        width:100%;
        max-width:280px;
      }

      .btn-group{
        width:100%;
      }
    }
  </style>
</head>

<body>

<div class="scroll-effect" id="scrollEffect"></div>

<div class="container">

  <div class="flower-top">🌸💐🌷</div>

  <h1>
    妈咪<br>
    <span class="highlight">母亲节快乐哦！！</span><br>
    耶耶耶！！
  </h1>

  <div class="message">
    特别特别爱妈咪 💖<br><br>

    我们一起吃饭 🍜<br>
    一起 lalaso 吧~~ ✨<br><br>

    希望妈咪每天都开心！<br>
    永远漂亮！永远幸福！<br><br>

    今天是属于世界上最好的妈咪的一天 🌸
  </div>

  <div class="love">
    💗💗💗
  </div>

  <div class="btn-group">
    <button onclick="releaseFlowers()">
      点我下花雨 🌸
    </button>

    <button onclick="bigLove()">
      超级爱妈咪 💖
    </button>

    <button onclick="magicMode()">
      开启梦幻模式 ✨
    </button>
  </div>

</div>

<div class="tip">
  点击屏幕会冒爱心 💕 ｜ 滑动页面有动态效果 ✨
</div>

<script>

  // 花瓣持续飘落
  function createPetal(){
    const petal = document.createElement('div');
    petal.className = 'petal';

    const flowers = ['🌸','💮','🌷','🌹','✨'];

    petal.innerHTML =
      flowers[Math.floor(Math.random() * flowers.length)];

    petal.style.left = Math.random() * window.innerWidth + 'px';

    petal.style.animationDuration =
      4 + Math.random() * 6 + 's';

    petal.style.fontSize =
      18 + Math.random() * 24 + 'px';

    document.body.appendChild(petal);

    setTimeout(()=>{
      petal.remove();
    },10000);
  }

  setInterval(createPetal, 500);

  // 点击冒爱心
  document.addEventListener('click',(e)=>{

    for(let i=0;i<6;i++){

      const heart = document.createElement('div');
      heart.className = 'heart';

      const hearts = ['💖','💗','💕','💘','💝'];

      heart.innerHTML =
        hearts[Math.floor(Math.random()*hearts.length)];

      heart.style.left =
        e.clientX + (Math.random()*60-30) + 'px';

      heart.style.top =
        e.clientY + (Math.random()*60-30) + 'px';

      document.body.appendChild(heart);

      setTimeout(()=>{
        heart.remove();
      },1500);
    }
  });

  // 花雨按钮
  function releaseFlowers(){

    for(let i=0;i<40;i++){

      setTimeout(()=>{
        createPetal();
      },i*80);
    }
  }

  // 超级爱妈咪
  function bigLove(){

    const text = document.createElement('div');

    text.innerHTML = '💖 妈咪我特别特别爱你！！！ 💖';

    text.style.position = 'fixed';
    text.style.left = '50%';
    text.style.top = '50%';
    text.style.transform = 'translate(-50%, -50%) scale(0.5)';
    text.style.fontSize = '2rem';
    text.style.padding = '25px 30px';
    text.style.background = 'rgba(255,255,255,.25)';
    text.style.backdropFilter = 'blur(10px)';
    text.style.borderRadius = '25px';
    text.style.zIndex = '9999';
    text.style.color = 'white';
    text.style.textAlign = 'center';
    text.style.boxShadow = '0 0 30px rgba(255,255,255,.5)';
    text.style.transition = '.4s';

    document.body.appendChild(text);

    setTimeout(()=>{
      text.style.transform =
        'translate(-50%, -50%) scale(1)';
    },50);

    setTimeout(()=>{
      text.style.opacity = '0';
    },2200);

    setTimeout(()=>{
      text.remove();
    },3000);
  }

  // 梦幻模式
  function magicMode(){

    document.body.style.transition = '1s';

    document.body.style.filter =
      'hue-rotate(' + Math.random()*360 + 'deg)';

    releaseFlowers();

    setTimeout(()=>{
      document.body.style.filter = 'none';
    },3000);
  }

  // 滑动背景动态
  const scrollEffect =
    document.getElementById('scrollEffect');

  window.addEventListener('scroll',()=>{

    const y = window.scrollY;

    scrollEffect.style.transform =
      `translateY(${y * 0.15}px)`;
  });

  // 自动欢迎弹窗
  window.onload = ()=>{

    setTimeout(()=>{

      bigLove();

    },1000);
  };

</script>

</body>
</html>
