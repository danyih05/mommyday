<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>妈咪母亲节快乐</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-family: 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
            overflow: hidden;
            position: relative;
        }
        .heart-container {
            animation: heartbeat 1.2s ease-in-out infinite;
        }
        .heart {
            width: 120px;
            height: 120px;
            background-color: #ff4d6d;
            position: relative;
            transform: rotate(-45deg);
            margin: 0 auto 40px;
        }
        .heart::before,
        .heart::after {
            content: "";
            width: 120px;
            height: 120px;
            background-color: #ff4d6d;
            border-radius: 50%;
            position: absolute;
        }
        .heart::before { top: -60px; left: 0; }
        .heart::after { top: 0; left: 60px; }
        @keyframes heartbeat {
            0% { transform: scale(1) rotate(-45deg); }
            14% { transform: scale(1.1) rotate(-45deg); }
            28% { transform: scale(1) rotate(-45deg); }
            42% { transform: scale(1.1) rotate(-45deg); }
            70% { transform: scale(1) rotate(-45deg); }
        }
        h1 {
            font-size: 2.8rem;
            color: #fff;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
            margin-bottom: 0.5rem;
            z-index: 1;
            text-align: center;
        }
        p {
            font-size: 1.4rem;
            color: #ffffffdd;
            text-align: center;
            padding: 0 20px;
            line-height: 1.8;
            z-index: 1;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.2);
        }
        .floating-hearts {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
        }
        .float-heart {
            position: absolute;
            bottom: -50px;
            font-size: 24px;
            color: #ff4d6d;
            opacity: 0.7;
            animation: floatUp 4s linear infinite;
        }
        @keyframes floatUp {
            0% {
                transform: translateY(0) scale(0.5);
                opacity: 0.8;
            }
            100% {
                transform: translateY(-110vh) scale(1.2);
                opacity: 0;
            }
        }
    </style>
</head>
<body>
    <div class="floating-hearts" id="floatingHearts"></div>
    <div class="heart-container">
        <div class="heart"></div>
    </div>
    <h1>妈咪，母亲节快乐</h1>
    <p>感谢您无尽的爱与付出<br>愿您永远健康、美丽、幸福<br>我爱您 ❤️</p>

    <script>
        function createFloatingHeart() {
            const heartDiv = document.createElement('div');
            heartDiv.classList.add('float-heart');
            heartDiv.innerHTML = '❤️';
            heartDiv.style.left = Math.random() * 100 + '%';
            heartDiv.style.fontSize = (Math.random() * 20 + 16) + 'px';
            heartDiv.style.animationDuration = (Math.random() * 3 + 3) + 's';
            heartDiv.style.animationDelay = Math.random() * 2 + 's';
            document.getElementById('floatingHearts').appendChild(heartDiv);
            heartDiv.addEventListener('animationend', () => {
                heartDiv.remove();
            });
        }
        setInterval(createFloatingHeart, 400);
        for(let i=0; i<10; i++) {
            setTimeout(createFloatingHeart, i * 200);
        }
    </script>
</body>
</html>
