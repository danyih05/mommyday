<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>妈咪母亲节快乐哦</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 50%, #ffe5b4 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-family: 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', cursive, sans-serif;
            overflow: hidden;
            position: relative;
            touch-action: manipulation;
        }

        canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 3;
        }

        .heart-container {
            animation: heartbeat 1.2s ease-in-out infinite;
        }
        .heart {
            width: 120px;
            height: 120px;
            background-color: #ff4d6d;
            position: relative;
            transform: rotate(-45deg);
            margin: 0 auto 40px;
            box-shadow: 0 0 15px rgba(255, 77, 109, 0.6);
        }
        .heart::before,
        .heart::after {
            content: "";
            width: 120px;
            height: 120px;
            background-color: #ff4d6d;
            border-radius: 50%;
            position: absolute;
            box-shadow: 0 0 15px rgba(255, 77, 109, 0.6);
        }
        .heart::before { top: -60px; left: 0; }
        .heart::after { top: 0; left: 60px; }

        @keyframes heartbeat {
            0% { transform: scale(1) rotate(-45deg); }
            14% { transform: scale(1.15) rotate(-45deg); }
            28% { transform: scale(1) rotate(-45deg); }
            42% { transform: scale(1.15) rotate(-45deg); }
            70% { transform: scale(1) rotate(-45deg); }
        }

        h1 {
            font-size: 2.8rem;
            color: #fff;
            text-shadow: 2px 2px 8px #ff9a9e, 0 0 15px #ffb6c1;
            margin-bottom: 0.5rem;
            z-index: 2;
            text-align: center;
            animation: glow 2s ease-in-out infinite alternate;
            padding: 0 15px;
        }
        @keyframes glow {
            from { text-shadow: 2px 2px 8px #ff9a9e, 0 0 15px #ffb6c1; }
            to { text-shadow: 2px 2px 12px #ff6b81, 0 0 25px #ffb6c1, 0 0 40px #ff9a9e; }
        }

        p {
            font-size: 1.5rem;
            color: #ffffff;
            text-align: center;
            line-height: 1.9;
            z-index: 2;
            text-shadow: 1px 1px 4px rgba(0,0,0,0.15);
            background: rgba(255, 255, 255, 0.25);
            backdrop-filter: blur(8px);
            border-radius: 28px;
            padding: 18px 28px;
            margin: 12px 20px;
            font-weight: 500;
            box-shadow: 0 8px 20px rgba(255, 105, 135, 0.2);
        }

        .floating-items {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        .float-item {
            position: absolute;
            bottom: -60px;
            font-size: 28px;
            animation: floatUp 7s linear infinite;
            opacity: 0.8;
            filter: drop-shadow(0 0 6px rgba(255, 192, 203, 0.8));
        }

        @keyframes floatUp {
            0% {
                transform: translateY(0) scale(0.3) rotate(0deg);
                opacity: 0.9;
            }
            100% {
                transform: translateY(-115vh) scale(1.4) rotate(360deg);
                opacity: 0;
            }
        }

        .fixed-flower {
            position: fixed;
            font-size: 50px;
            opacity: 0.3;
            pointer-events: none;
            z-index: 0;
            animation: sway 3.5s ease-in-out infinite;
            filter: drop-shadow(0 0 6px #ffb6c1);
        }
        @keyframes sway {
            0%, 100% { transform: rotate(-5deg) scale(1); }
            50% { transform: rotate(5deg) scale(1.12); }
        }
    </style>
</head>
<body>
    <div class="floating-items" id="floatingItems"></div>

    <div class="fixed-flower" style="top: 4%; left: 4%; animation-delay: 0s;">🌺</div>
    <div class="fixed-flower" style="top: 8%; right: 6%; animation-delay: 1.2s; font-size: 44px;">🌸</div>
    <div class="fixed-flower" style="bottom: 12%; left: 5%; animation-delay: 2.1s;">🌼</div>
    <div class="fixed-flower" style="bottom: 8%; right: 4%; animation-delay: 0.6s; font-size: 55px;">🌷</div>
    <div class="fixed-flower" style="top: 45%; left: 2%; animation-delay: 1.8s; font-size: 38px;">💮</div>
    <div class="fixed-flower" style="top: 55%; right: 3%; animation-delay: 0.9s; font-size: 45px;">🌻</div>

    <canvas id="effectCanvas"></canvas>

    <div class="heart-container">
        <div class="heart"></div>
    </div>
    <h1>妈咪母亲节快乐哦！！耶耶耶！！</h1>
    <p>特别特别爱妈咪，我们一起吃饭一起lalaso吧~~</p>

    <script>
        // ==================== 飘浮元素（数量控制优化） ====================
        const items = ['❤️', '🌸', '🌼', '🌺', '🌷', '💐', '✨', '🌻', '💖', '🍃', '🌿', '💮'];
        const FLOAT_MAX = 18;
        const floatContainer = document.getElementById('floatingItems');

        function removeOldestFloat() {
            while (floatContainer.children.length > FLOAT_MAX) {
                const first = floatContainer.firstChild;
                if (first) floatContainer.removeChild(first);
            }
        }

        function createFloatingItem() {
            removeOldestFloat();
            const div = document.createElement('div');
            div.classList.add('float-item');
            div.innerHTML = items[Math.floor(Math.random() * items.length)];
            div.style.left = Math.random() * 95 + '%';
            div.style.fontSize = (Math.random() * 26 + 18) + 'px';
            div.style.animationDuration = (Math.random() * 5 + 5) + 's';
            div.style.animationDelay = '0s';
            floatContainer.appendChild(div);
            div.addEventListener('animationend', () => div.remove());
        }

        // 降低生成频率并控制数量
        setInterval(createFloatingItem, 500);
        for (let i = 0; i < 12; i++) setTimeout(createFloatingItem, i * 100);

        // ==================== Canvas 交互特效（修复并优化） ====================
        const canvas = document.getElementById('effectCanvas');
        const ctx = canvas.getContext('2d');
        let width, height;

        function resizeCanvas() {
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width;
            canvas.height = height;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        let particles = [];
        const PARTICLE_MAX = 120;

        class Particle {
            constructor(x, y, type, text = '') {
                this.x = x;
                this.y = y;
                this.type = type;
                this.age = 0;
                this.maxAge = type === 'clickBurst' ? 1.0 : 0.6;
                this.scale = 1;
                this.alpha = 1;
                this.text = text;
                this.vx = (Math.random() - 0.5) * 2.5;
                this.vy = (Math.random() - 0.5) * 2.5 - 0.8;
                this.rotation = Math.random() * Math.PI * 2;
                this.rotSpeed = (Math.random() - 0.5) * 3;
            }

            update(dt) {
                this.age += dt;
                return this.age < this.maxAge;
            }

            draw(ctx) {
                const progress = this.age / this.maxAge;
                if (this.type === 'clickBurst') {
                    this.scale = 1 + Math.sin(progress * Math.PI) * 1.4;
                    this.alpha = 1 - Math.pow(progress, 1.3);
                } else {
                    this.scale = 0.8 * (1 - progress);
                    this.alpha = 0.8 * (1 - progress);
                }

                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.rotate(this.rotation);
                ctx.scale(this.scale, this.scale);
                ctx.globalAlpha = this.alpha;

                if (this.type === 'clickBurst' && this.text) {
                    // 绘制甜甜的文字
                    ctx.font = `${24 * this.scale}px "PingFang SC", "Microsoft YaHei", sans-serif`;
                    ctx.fillStyle = '#fff';
                    ctx.shadowColor = '#ff6b81';
                    ctx.shadowBlur = 8;
                    ctx.fillText(this.text, -ctx.measureText(this.text).width / 2, 8);
                    ctx.shadowColor = 'transparent';
                    ctx.shadowBlur = 0;
                } else if (this.type === 'clickBurst') {
                    // 绘制花朵
                    ctx.font = '30px sans-serif';
                    ctx.fillText('🌸', -15, -15);
                } else {
                    // 拖尾星星/爱心
                    ctx.font = '20px sans-serif';
                    ctx.fillText(Math.random() > 0.5 ? '✨' : '💖', -10, -10);
                }
                ctx.restore();

                this.x += this.vx;
                this.y += this.vy;
                this.rotation += this.rotSpeed;
            }
        }

        function addParticle(particle) {
            particles.push(particle);
            while (particles.length > PARTICLE_MAX) {
                particles.shift();
            }
        }

        function createClickBurst(x, y) {
            addParticle(new Particle(x, y, 'clickBurst'));
            for (let i = 0; i < 6; i++) {
                let p = new Particle(x, y, 'clickBurst');
                p.vx = (Math.random() - 0.5) * 5;
                p.vy = (Math.random() - 0.5) * 5 - 1;
                p.maxAge = 0.7 + Math.random() * 0.4;
                addParticle(p);
            }
            const sweetWords = ['爱你', '耶!', '妈咪', 'lalaso', '❤️', '🌸', '快乐'];
            if (Math.random() > 0.4) {
                let word = sweetWords[Math.floor(Math.random() * sweetWords.length)];
                let textP = new Particle(x, y - 20, 'clickBurst', word);
                textP.vx = 0;
                textP.vy = -2;
                textP.maxAge = 1.2;
                addParticle(textP);
            }
        }

        function createTrailParticle(x, y) {
            addParticle(new Particle(x, y, 'trail'));
        }

        let isTouching = false;
        let lastTrailTime = 0;
        const TRAIL_INTERVAL = 40; // 拖尾间隔 ms

        // 触摸事件
        canvas.addEventListener('touchstart', (e) => {
            e.preventDefault();
            const touch = e.touches[0];
            createClickBurst(touch.clientX, touch.clientY);
            isTouching = true;
            lastTrailTime = performance.now();
        }, { passive: false });

        canvas.addEventListener('touchmove', (e) => {
            e.preventDefault();
            if (!isTouching) return;
            const now = performance.now();
            if (now - lastTrailTime > TRAIL_INTERVAL) {
                const touch = e.touches[0];
                createTrailParticle(touch.clientX, touch.clientY);
                lastTrailTime = now;
            }
        }, { passive: false });

        canvas.addEventListener('touchend', (e) => {
            e.preventDefault();
            isTouching = false;
        });

        // 鼠标支持（方便调试）
        canvas.addEventListener('mousedown', (e) => {
            createClickBurst(e.clientX, e.clientY);
            isTouching = true;
            lastTrailTime = performance.now();
        });
        canvas.addEventListener('mousemove', (e) => {
            if (!isTouching) return;
            const now = performance.now();
            if (now - lastTrailTime > TRAIL_INTERVAL) {
                createTrailParticle(e.clientX, e.clientY);
                lastTrailTime = now;
            }
        });
        canvas.addEventListener('mouseup', () => isTouching = false);
        canvas.addEventListener('mouseleave', () => isTouching = false);

        // 动画循环
        let lastTimestamp = 0;
        function animate(timestamp) {
            if (!lastTimestamp) lastTimestamp = timestamp;
            const dt = Math.min((timestamp - lastTimestamp) / 1000, 0.04);
            lastTimestamp = timestamp;

            ctx.clearRect(0, 0, width, height);
            particles = particles.filter(p => {
                if (!p.update(dt)) return false;
                p.draw(ctx);
                return true;
            });

            requestAnimationFrame(animate);
        }
        requestAnimationFrame(animate);
    </script>
</body>
</html>
