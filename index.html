<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>妈咪母亲节快乐哦</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 50%, #ffe5b4 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-family: 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', cursive, sans-serif;
            overflow: hidden;
            position: relative;
        }

        /* 跳动大爱心 */
        .heart-container {
            animation: heartbeat 1.2s ease-in-out infinite;
        }
        .heart {
            width: 120px;
            height: 120px;
            background-color: #ff4d6d;
            position: relative;
            transform: rotate(-45deg);
            margin: 0 auto 40px;
            box-shadow: 0 0 25px rgba(255, 77, 109, 0.7);
        }
        .heart::before,
        .heart::after {
            content: "";
            width: 120px;
            height: 120px;
            background-color: #ff4d6d;
            border-radius: 50%;
            position: absolute;
            box-shadow: 0 0 25px rgba(255, 77, 109, 0.7);
        }
        .heart::before { top: -60px; left: 0; }
        .heart::after { top: 0; left: 60px; }

        @keyframes heartbeat {
            0% { transform: scale(1) rotate(-45deg); }
            14% { transform: scale(1.18) rotate(-45deg); }
            28% { transform: scale(1) rotate(-45deg); }
            42% { transform: scale(1.18) rotate(-45deg); }
            70% { transform: scale(1) rotate(-45deg); }
        }

        h1 {
            font-size: 2.8rem;
            color: #fff;
            text-shadow: 2px 2px 8px #ff9a9e, 0 0 20px #ffb6c1;
            margin-bottom: 0.5rem;
            z-index: 2;
            text-align: center;
            animation: glow 2s ease-in-out infinite alternate;
            padding: 0 15px;
        }
        @keyframes glow {
            from { text-shadow: 2px 2px 8px #ff9a9e, 0 0 20px #ffb6c1; }
            to { text-shadow: 2px 2px 14px #ff6b81, 0 0 30px #ffb6c1, 0 0 45px #ff9a9e; }
        }

        p {
            font-size: 1.5rem;
            color: #ffffff;
            text-align: center;
            line-height: 1.9;
            z-index: 2;
            text-shadow: 1px 1px 4px rgba(0,0,0,0.15);
            background: rgba(255, 255, 255, 0.25);
            backdrop-filter: blur(8px);
            border-radius: 28px;
            padding: 18px 28px;
            margin: 12px 20px;
            font-weight: 500;
            box-shadow: 0 8px 20px rgba(255, 105, 135, 0.2);
        }

        /* 飘浮小元素容器 */
        .floating-items {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        .float-item {
            position: absolute;
            bottom: -60px;
            font-size: 28px;
            animation: floatUp 7s linear infinite;
            opacity: 0.85;
            filter: drop-shadow(0 0 8px rgba(255, 192, 203, 0.9));
        }

        @keyframes floatUp {
            0% {
                transform: translateY(0) scale(0.3) rotate(0deg);
                opacity: 0.9;
            }
            100% {
                transform: translateY(-115vh) scale(1.4) rotate(360deg);
                opacity: 0;
            }
        }

        /* 四角摇摆花朵 */
        .fixed-flower {
            position: fixed;
            font-size: 55px;
            opacity: 0.3;
            pointer-events: none;
            z-index: 0;
            animation: sway 3.5s ease-in-out infinite;
            filter: drop-shadow(0 0 10px #ffb6c1);
        }
        @keyframes sway {
            0%, 100% { transform: rotate(-6deg) scale(1); }
            50% { transform: rotate(6deg) scale(1.15); }
        }
    </style>
</head>
<body>
    <!-- 飘浮的爱心、鲜花、星星 -->
    <div class="floating-items" id="floatingItems"></div>

    <!-- 角落花花装饰 -->
    <div class="fixed-flower" style="top: 4%; left: 4%; animation-delay: 0s;">🌺</div>
    <div class="fixed-flower" style="top: 8%; right: 6%; animation-delay: 1.2s; font-size: 48px;">🌸</div>
    <div class="fixed-flower" style="bottom: 12%; left: 5%; animation-delay: 2.1s;">🌼</div>
    <div class="fixed-flower" style="bottom: 8%; right: 4%; animation-delay: 0.6s; font-size: 60px;">🌷</div>
    <div class="fixed-flower" style="top: 45%; left: 2%; animation-delay: 1.8s; font-size: 42px;">💮</div>
    <div class="fixed-flower" style="top: 55%; right: 3%; animation-delay: 0.9s; font-size: 50px;">🌻</div>

    <!-- 大爱心 -->
    <div class="heart-container">
        <div class="heart"></div>
    </div>

    <!-- 你的祝福语 -->
    <h1>妈咪母亲节快乐哦！！耶耶耶！！</h1>
    <p>特别特别爱妈咪，我们一起吃饭一起lalaso吧~~</p>

    <script>
        // 飘浮元素池：爱心、各种鲜花、亮闪闪
        const items = ['❤️', '🌸', '🌼', '🌺', '🌷', '💐', '✨', '🌻', '💖', '🍃', '🌿', '💮'];

        function createFloatingItem() {
            const div = document.createElement('div');
            div.classList.add('float-item');
            // 随机挑选一个可爱元素
            div.innerHTML = items[Math.floor(Math.random() * items.length)];
            div.style.left = Math.random() * 95 + '%';
            div.style.fontSize = (Math.random() * 28 + 20) + 'px';
            div.style.animationDuration = (Math.random() * 6 + 6) + 's';
            div.style.animationDelay = Math.random() * 1.5 + 's';
            document.getElementById('floatingItems').appendChild(div);

            // 动画结束后清理掉，避免内存占用
            div.addEventListener('animationend', () => {
                div.remove();
            });
        }

        // 每 400ms 飘出一个新元素，整个屏幕一直有花花
        setInterval(createFloatingItem, 400);

        // 开局先飘一波，氛围直接拉满
        for(let i = 0; i < 18; i++) {
            setTimeout(createFloatingItem, i * 120);
        }
    </script>
</body>
</html>
